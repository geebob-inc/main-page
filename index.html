<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Button Example</title>

<style>
  /* Styling to make the button look nice on the screen */
  .print-btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  .print-btn:hover {
    background-color: #0056b3;
  }

  /* PRINT RULES 
    This tells the printer to hide the button and any other 
    elements you don't want on the physical paper.
  */
  @media print {
    .print-btn {
      display: none !important;
    }
  }
</style>
</head>
<body>

  <h1>My Web Page</h1>
  <p>This is a test page to show how the print button works. When you click the button below, this text will print, but the button itself will completely disappear from the paper!</p>

  <button class="print-btn" onclick="window.print()">🖨 Print Page</button>

</body>
</html>
